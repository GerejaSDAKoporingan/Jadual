<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Petugas — SDA Koporingan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
<style type="text/tailwindcss">
@theme inline { --color-background: var(--background); --color-foreground: var(--foreground); --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground); --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground); --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground); --color-card: var(--card); --color-border: var(--border); }
:root { --background:#F1F5F9; --foreground:#172033; --primary:#1D4ED8; --primary-foreground:#fff; --secondary:#E2E8F0; --secondary-foreground:#334155; --muted:#CBD5E1; --muted-foreground:#64748B; --card:#F8FAFC; --border:#CBD5E1; --radius:.5rem; --font-sans:"Inter"; --font-mono:"JetBrains Mono"; }
*,*::before,*::after{scrollbar-width:none} *::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="min-h-screen bg-background text-foreground pb-24 font-sans">
<header class="sticky top-0 z-20 border-b border-border bg-background/90 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
    <div><h1 class="font-heading text-xl font-bold tracking-tight">Petugas</h1><p class="text-xs text-muted-foreground">Senarai dari List Petugas · Tambah baru direct ke Sheet</p></div>
    <button id="btnAdd" class="flex items-center gap-1.5 rounded-md bg-primary px-3 py-1.5 text-xs font-semibold text-primary-foreground"><iconify-icon icon="ph:plus-bold" width="16" height="16"></iconify-icon><span>Petugas Baru</span></button>
  </div>
</header>
<main class="mx-auto max-w-6xl space-y-4 px-5 py-4">
  <div class="relative w-full sm:w-64"><input id="q" placeholder="Cari nama…" class="w-full rounded-md border border-border bg-card py-1.5 pl-3 pr-3 text-xs" /></div>
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3" id="grid"></div>
</main>

<div id="addModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-lg border border-border bg-white p-4">
    <h3 class="font-bold">Tambah Petugas Baru</h3>
    <p class="text-xs text-muted-foreground">Terus simpan ke tab List Petugas.</p>
    <label class="mt-3 block text-xs font-semibold">Nama penuh * (cth EN. BARU / PN. BARU / CIK. BARU)</label>
    <input id="aNama" class="mt-1 w-full rounded-md border border-border bg-card px-2.5 py-2 text-sm" placeholder="EN. NAMA BARU" />
    <div class="mt-2 grid grid-cols-2 gap-2">
      <div><label class="block text-xs font-semibold">Jabatan</label><input id="aJab" class="mt-1 w-full rounded-md border border-border bg-card px-2.5 py-2 text-sm" placeholder="—" /></div>
      <div><label class="block text-xs font-semibold">Peranan / Jawatan (Elder, Pastor, Music, Media…)</label><input id="aPer" class="mt-1 w-full rounded-md border border-border bg-card px-2.5 py-2 text-sm" placeholder="cth Elder" /></div>
    </div>
    <p id="aErr" class="mt-2 hidden text-xs font-semibold text-red-700"></p>
    <div class="mt-4 flex gap-2"><button id="aCancel" class="flex-1 rounded-md border border-border py-2 text-xs font-semibold">Batal</button><button id="aSave" class="flex-1 rounded-md bg-primary py-2 text-xs font-semibold text-white">Simpan</button></div>
  </div>
</div>

<nav class="fixed inset-x-0 bottom-0 z-30 border-t border-border bg-card/95 backdrop-blur-md">
  <div class="mx-auto flex max-w-2xl items-center justify-around px-2 py-2">
    <a class="flex flex-1 flex-col items-center gap-1 rounded-md py-1.5 text-muted-foreground" href="index.html"><iconify-icon icon="ph:house" width="20" height="20"></iconify-icon><span class="text-[11px] font-medium">Laman</span></a>
    <a class="flex flex-1 flex-col items-center gap-1 rounded-md py-1.5 text-muted-foreground" href="jadual.html"><iconify-icon icon="ph:calendar-blank" width="20" height="20"></iconify-icon><span class="text-[11px] font-medium">Isi</span></a>
    <a class="flex flex-1 flex-col items-center gap-1 rounded-md py-1.5 text-primary" href="petugas.html"><iconify-icon icon="ph:user-circle" width="20" height="20"></iconify-icon><span class="text-[11px] font-semibold">Petugas</span></a>
  </div>
</nav>
</div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  let DB=null;
  const grid=document.getElementById('grid'), q=document.getElementById('q');
  const modal=document.getElementById('addModal');
  document.getElementById('btnAdd').onclick=()=>{modal.classList.remove('hidden');modal.classList.add('flex');};
  document.getElementById('aCancel').onclick=()=>{modal.classList.add('hidden');modal.classList.remove('flex');};
  q.oninput=render;
  function render(){
    if(!DB) return;
    const s=(q.value||'').toUpperCase();
    const mine=window.JadualApp.getMyName();
    grid.innerHTML=DB.petugas.filter(p=>!s||p.nama.toUpperCase().includes(s)||(p.peranan||'').toUpperCase().includes(s)).map(p=>{
      const ini=p.nama.split(' ').map(w=>w[0]).slice(0,2).join('').replace('.','');
      const isMe=mine&&window.JadualApp.norm(p.nama)===window.JadualApp.norm(mine);
      return `<div class="rounded-lg border ${isMe?'border-primary ring-1 ring-primary':'border-border'} bg-card p-3.5"><div class="flex items-center gap-2"><div class="flex size-8 items-center justify-center rounded-full bg-primary text-[11px] font-bold text-white">${ini}</div><div class="flex-1"><p class="text-sm font-semibold">${p.nama}</p><p class="font-mono text-[11px] text-muted-foreground">${p.peranan||'—'} · ${p.aktif||'Y'}${isMe?' · ✓ Saya':''}</p></div><button data-n="${p.nama.replace(/"/g,'&quot;')}" class="iam rounded-md border border-border px-2 py-1 text-[11px] font-bold">Saya</button></div></div>`;
    }).join('');
    grid.querySelectorAll('.iam').forEach(b=>b.onclick=()=>{ window.JadualApp.setMyName(b.dataset.n); render(); });
  }
  document.getElementById('aSave').onclick=async ()=>{
    const nama=document.getElementById('aNama').value.trim(), jab=document.getElementById('aJab').value.trim(), per=document.getElementById('aPer').value.trim();
    const err=document.getElementById('aErr');
    if(!nama){err.textContent='Nama wajib diisi.';err.classList.remove('hidden');return;}
    if(DB.petugas.some(p=>window.JadualApp.norm(p.nama)===window.JadualApp.norm(nama))){err.textContent='Nama sudah wujud dalam List Petugas.';err.classList.remove('hidden');return;}
    if(!confirm('Tambah '+nama+' ke List Petugas?')) return;
    try{
      document.getElementById('aSave').textContent='Menyimpan…';
      await window.JadualApp.apiPost({action:'addPetugas', nama, jabatan: jab, peranan: per});
      location.reload();
    }catch(e){err.textContent=e.message;err.classList.remove('hidden');}
    finally{document.getElementById('aSave').textContent='Simpan';}
  };
  (async function(){try{DB=await window.JadualApp.loadDB();render();}catch(e){grid.innerHTML='<p class="text-sm text-red-700">'+e.message+'</p>';}})();
})();
</script>
</body>
</html>
